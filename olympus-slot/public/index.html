<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olympus Slot (play money)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/fx.css" />
</head>
<body>
  <div class="app">

    <header class="temple-header">
      <svg class="sprig sprig-left" viewBox="0 0 30 60" width="20" height="40"><use href="#laurel-sprig"/></svg>
      <div class="temple-title">
        <h1>Olympus Slot</h1>
        <p class="subtitle">Play-money demo — no real currency involved</p>
      </div>
      <svg class="sprig sprig-right" viewBox="0 0 30 60" width="20" height="40"><use href="#laurel-sprig"/></svg>
    </header>

    <div class="gold-divider"><span class="divider-ornament"></span></div>

    <!-- Reusable laurel sprig, referenced via <use> so the artwork lives in one place -->
    <svg width="0" height="0" style="position:absolute">
      <symbol id="laurel-sprig" viewBox="0 0 30 60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M15 58 C15 40 15 20 15 2" />
        <ellipse cx="9" cy="10" rx="6" ry="3" transform="rotate(-30 9 10)"/>
        <ellipse cx="21" cy="10" rx="6" ry="3" transform="rotate(30 21 10)"/>
        <ellipse cx="8" cy="22" rx="6" ry="3" transform="rotate(-30 8 22)"/>
        <ellipse cx="22" cy="22" rx="6" ry="3" transform="rotate(30 22 22)"/>
        <ellipse cx="7" cy="34" rx="6" ry="3" transform="rotate(-30 7 34)"/>
        <ellipse cx="23" cy="34" rx="6" ry="3" transform="rotate(30 23 34)"/>
        <ellipse cx="6" cy="46" rx="6" ry="3" transform="rotate(-30 6 46)"/>
        <ellipse cx="24" cy="46" rx="6" ry="3" transform="rotate(30 24 46)"/>
      </symbol>
    </svg>

    <div class="player-row">
      <label for="playerName">Player</label>
      <input id="playerName" value="guest" />
      <button id="loadPlayer">Load</button>
      <button id="muteBtn" title="Toggle sound">🔊</button>
    </div>

    <div class="settings-row">
      <label for="voiceSelect">Announcer voice</label>
      <select id="voiceSelect">
        <option value="">Auto (pleasant + excited)</option>
      </select>
    </div>

    <div class="card">
      <div class="stats-row">
        <div>
          <p class="label">Balance</p>
          <p class="value" id="balance">1,000</p>
        </div>
        <div>
          <p class="label">Multiplier</p>
          <p class="value accent" id="mult">1x</p>
        </div>
        <div>
          <p class="label">Last win</p>
          <p class="value success" id="lastwin">0</p>
        </div>
      </div>

      <p class="net-line" id="netLine"></p>

      <div id="freespinsbadge" class="badge">Free spins: <span id="fscount">0</span> left</div>
      <div id="autospinbadge" class="badge autospin-badge">Auto spin: <span id="autospinsleft">0</span> left</div>

      <div class="reels-wrap">
        <div id="reels" class="reels"></div>
        <div id="scatterFlash" class="scatter-flash"></div>
        <div id="winBanner" class="win-banner">
          <div class="win-laurel">
            <svg class="wreath-left" viewBox="0 0 30 60" width="22" height="44"><use href="#laurel-sprig"/></svg>
            <span id="winBannerLabel">WIN</span>
            <svg class="wreath-right" viewBox="0 0 30 60" width="22" height="44"><use href="#laurel-sprig"/></svg>
          </div>
          <span id="winBannerAmount">0</span>
        </div>
      </div>

      <p id="msg" class="msg">Land 4+ scatters to trigger free spins</p>

      <div class="bet-row">
        <label>Bet</label>
        <input type="range" min="10" max="500" step="10" value="20" id="bet" />
        <input type="number" min="10" step="10" value="20" id="betNumber" />
      </div>
      <div class="bet-quick-row">
        <button class="quickbtn" id="betHalf">½</button>
        <button class="quickbtn" id="betDouble">2×</button>
        <button class="quickbtn" id="betMax">Max</button>
      </div>

      <button id="spinbtn" class="spin-btn">Spin</button>

      <div class="autospin-row">
        <label for="autospinCount">Auto spin</label>
        <select id="autospinCount">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <button id="autospinBtn" class="autospin-btn">Start</button>
      </div>
    </div>
  </div>

  <script src="js/cardArt.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/reels.js"></script>
  <script src="js/betControls.js"></script>
  <script src="js/autospin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
